name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: test
        run: go test ./...
      - name: build
        run: |
          ext=""
          [ "${{ matrix.os }}" = windows ] && ext=".exe"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -o go2js-${{ matrix.os }}-${{ matrix.arch }}$ext ./cmd/go2js
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: go2js-${{ matrix.os }}-${{ matrix.arch }}
          path: go2js-*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: ( cd dist && sha256sum go2js-* > SHA256SUMS )
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**