name: portable

# Builds, tests and runs the examples on Linux, macOS and Windows, so the claim
# that go2js works on all three is one that is checked rather than assumed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build the compiler
        run: go build -o bin/go2js ./cmd/go2js
      - name: unit tests
        run: |
          set +e
          go test ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # each failing test is repeated as one annotation holding what it said,
          # so the run page shows the reason without opening the log
          cat > annotate.py <<'PY'
          import re
          lines = open("test.log", errors="replace").read().splitlines()
          starts = [i for i, l in enumerate(lines) if re.match(r"\s*--- FAIL", l)]
          for i in starts[:10]:
              body = "\n".join(x[:300] for x in lines[i:i + 45])
              body = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=" + lines[i].strip()[:80].replace(",", " ").replace(":", " ") + "::" + body)
          PY
          (python3 annotate.py || python annotate.py) || true
          exit $status
      - name: build go2js-min
        if: always()
        run: |
          cd tools/jsmin
          g++ -O2 -std=c++17 -o go2js-min cl.cpp lx.cpp em.cpp rn.cpp fm.cpp pg.cpp
      - name: run the examples both ways
        if: always()
        run: examples/build.sh
