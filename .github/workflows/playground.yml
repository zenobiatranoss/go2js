name: playground

# The website (generated by tools/sitegen) is published on every push that changes it, and by hand.
# The playground is built beside it, but the website does not wait on it: if the WebAssembly build
# fails, the website still goes out and the playground folder is simply left out.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'examples/**'
      - 'tools/sitegen/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/playground.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: get the wasi-sdk, which builds the shrinker
        continue-on-error: true
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: build the compiler as WebAssembly
        continue-on-error: true
        run: ./scripts/playground.sh
      - name: build the website pages from the repository's own documents
        run: go run ./tools/sitegen -out pages
      - name: add the playground and the search-engine verification files
        run: |
          if [ -f playground/playground.wasm ]; then mkdir -p pages/playground && cp -R playground/. pages/playground/; else echo 'playground not built; publishing the website alone'; fi
          cp google* pages/ 2>/dev/null || true
          cp sxayjuanm*.html pages/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
