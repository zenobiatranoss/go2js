name: playground

# The playground is published by hand rather than on every push, so the page
# that goes out is one that was looked at first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: get the wasi-sdk, which builds the shrinker
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: build the compiler as WebAssembly
        run: ./scripts/playground.sh
      - name: assemble both pages
        # gonvertjs at / and gonvertjs-playground at /playground/
        run: |
          rm -rf pages
          mkdir -p pages/playground
          cp index.html go2jslog.png pages/
          find . -maxdepth 1 -type f -name 'google*' -exec cp {} pages/ \;
          cp -R playground/. pages/playground/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
